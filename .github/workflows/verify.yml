# Website verification CI for gyutron.com (the Astro brand site in astro/).
# Build + structural gates only — this NEVER deploys. Cloudflare serves the committed public/
# via its own Worker (see docs/DEPLOYMENT.md); this workflow just stops a broken PR from merging.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid piling up redundant runs on rapid pushes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - uses: actions/checkout@v4
        with:
          # Shop smoke pins protected files to historical baseline commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json

      - name: Install Astro dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Install Worker dependencies (locked)
        working-directory: ${{ github.workspace }}
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # Hard gates — deterministic, fail the run on regression.
      - name: Verify agent handoff contract
        run: npm run verify:handoff
      - name: Verify header equivalence
        run: npm run verify:header
      - name: Verify two-purple button contract
        run: npm run verify:button-purple
      - name: Verify cross-platform CSS cache keys
        run: npm run verify:css-version
      - name: Verify Turnstile on all brand forms
        run: npm run verify:turnstile
      - name: Verify shared scroll controls
        run: npm run verify:scroll-chrome
      - name: Verify sitemap
        run: npm run verify:sitemap
      - name: Verify routes / nav links
        run: npm run verify:routes
      - name: Verify SEO head
        run: npm run verify:seo
      - name: Verify accessibility (a11y-lite)
        run: npm run verify:a11y-lite
      - name: Verify decorative-content icon policy
        run: npm run verify:content-icons

      # Informational — heuristic residual-English scan (report mode, never fails the run).
      # Promote to a gate with `-- --strict` once product-spec translation is complete.
      - name: Verify i18n (report)
        run: npm run verify:i18n
      - name: Verify assets (report)
        run: npm run verify:assets

      # Repository-wide gates: Worker logic, Shop isolation, committed deploy output.
      - name: Verify Worker platform logic
        working-directory: ${{ github.workspace }}
        run: node scripts/smoke-platform.mjs
      - name: Verify Operations API and preserved order administration
        working-directory: ${{ github.workspace }}
        run: node scripts/smoke-admin-api.mjs
      - name: Verify Operations authentication and team access
        working-directory: ${{ github.workspace }}
        run: node scripts/smoke-admin-auth.mjs
      - name: Verify quotations, immutable issue snapshots and revisions
        working-directory: ${{ github.workspace }}
        run: node scripts/smoke-admin-quotes.mjs
      - name: Verify exact multi-currency dashboard aggregation
        working-directory: ${{ github.workspace }}
        run: node scripts/smoke-admin-aggregation.mjs
      - name: Verify Operations backup and isolated recovery
        working-directory: ${{ github.workspace }}
        run: node scripts/smoke-admin-backup.mjs
      - name: Verify customer workspaces, saved views and batch results
        working-directory: ${{ github.workspace }}
        run: node scripts/test-workspace-experience.mjs
      - name: Verify commerce imports, reports, rules and durable automation
        working-directory: ${{ github.workspace }}
        run: node scripts/test-operations-core.mjs
      - name: Verify knowledge, model security and commercial license signatures
        working-directory: ${{ github.workspace }}
        run: node scripts/test-intelligence.mjs
      - name: Verify independent cross-module failure and controller checks
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/test-intelligence-cross-review.mjs
          node scripts/test-intelligence-crm-controller.mjs
          node scripts/test-operations-intelligence-review.mjs
          node scripts/test-notifications.mjs
      - name: Prepare portable test scratch directory
        working-directory: ${{ github.workspace }}
        run: node -e "require('node:fs').mkdirSync('.wrangler',{recursive:true})"
      - name: Verify independent bounded bulk UI outcomes
        working-directory: ${{ github.workspace }}
        run: node scripts/test-operations-bulk-ui.mjs
      - name: Verify offline per-instance license issuance
        working-directory: ${{ github.workspace }}
        run: node scripts/test-operations-license-issuer.mjs
      - name: Verify continuous automation progress and cancellation
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/test-operations-run-ui.mjs
          node scripts/test-operations-run-review.mjs
      - name: Verify emitted admin frontend, locale and routing contracts
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/check-admin-frontend.mjs
          node scripts/check-admin-routes.mjs
      - name: Verify Shop baseline
        working-directory: ${{ github.workspace }}
        run: npm run shop:verify
      - name: Verify Worker bundle / bindings (dry run)
        working-directory: ${{ github.workspace }}
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - name: Verify built brand output is committed
        working-directory: ${{ github.workspace }}
        run: npm run deploy:check
      - name: Verify committed whitespace
        working-directory: ${{ github.workspace }}
        run: git show --check --oneline --no-renames HEAD
