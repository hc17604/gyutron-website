<!DOCTYPE html>
<html lang="{{locale.lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{t:ceng.seo.title}}</title>
    <meta name="description" content="{{t:ceng.copy}}">
    <meta property="og:title" content="{{t:ceng.seo.title}}">
    <meta property="og:description" content="{{t:ceng.copy}}">
    <meta property="og:locale" content="{{locale.og}}">
    {{locale.alternates}}
{{include:shop-head-tail}}
</head>
<body>
{{include:shop-header}}

    <main id="main-content">
        <section class="section">
            <div class="container">
                <div class="section-head">
                    <div>
                        <span class="eyebrow" data-i18n="ceng.eyebrow">Contact Engineer</span>
                        <h1 style="color:var(--ink);font-size:48px;" data-i18n="ceng.title">Confirm the right industrial product before ordering.</h1>
                    </div>
                    <p data-i18n="ceng.copy">For machine vision, sensors, RFID, scanners, or integration questions, send your environment and workflow details.</p>
                </div>
                <form class="form" method="post" action="/api/support" data-demo-form>
                    <div class="form-grid">
                        <div class="field"><label for="engineer-sku" data-i18n="form.productSku">Product SKU</label><input id="engineer-sku" name="sku" autocomplete="off" data-prefill-sku data-i18n-attr="placeholder=ph.optional" placeholder="Optional"></div>
                        <div class="field"><label for="engineer-application" data-i18n="form.appArea">Application Area</label><select id="engineer-application" name="application"><option value="machine-vision" data-i18n="app.mv">Machine vision inspection</option><option value="warehouse-rfid" data-i18n="app.warehouse">Warehouse / RFID</option><option value="barcode-scanning" data-i18n="app.barcode">Barcode scanning</option><option value="industrial-sensing" data-i18n="app.sensing">Industrial sensing</option><option value="robot-automation" data-i18n="app.robot">Robot / automation cell</option><option value="other" data-i18n="app.other">Other</option></select></div>
                        <div class="field"><label for="engineer-name" data-i18n="form.name">Name</label><input id="engineer-name" required name="name" autocomplete="name"></div>
                        <div class="field"><label for="engineer-email" data-i18n="form.workEmail">Work Email</label><input id="engineer-email" required type="email" name="email" autocomplete="email"></div>
                        <div class="field"><label for="engineer-company" data-i18n="form.company">Company</label><input id="engineer-company" name="company" autocomplete="organization"></div>
                        <div class="field field-wide"><label for="engineer-question" data-i18n="form.techQuestion">Technical Question</label><textarea id="engineer-question" required minlength="8" name="question" data-i18n-attr="placeholder=ph.techQuestion" placeholder="Part size, speed, distance, code type, lighting, interface, environment, or existing equipment."></textarea></div>
                    </div>
                    <button class="button button-primary" type="submit" data-i18n="ceng.submit">Send to Engineer</button>
                </form>
            </div>
        </section>
    </main>

{{include:shop-footer}}
    <script>window.GYUTRON_SHOP_LOCALE="{{locale.lang}}";</script>
    <script src="{{locale.base}}/shop/shop-i18n.js"></script>
    <script src="{{locale.base}}/shop/shop.js"></script>
</body>
</html>
