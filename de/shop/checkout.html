<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasse | Offizieller GYUTRON Store</title>
    <meta name="description" content="GYUTRON Kassenanfrage für Bestellungen von Industrieprodukten.">
    <meta property="og:title" content="Kasse | Offizieller GYUTRON Store">
    <meta property="og:description" content="GYUTRON Kassenanfrage für Bestellungen von Industrieprodukten.">
    <meta property="og:locale" content="de_DE">
    <link rel="canonical" href="https://shop.gyutron.com/de/shop/checkout.html">
    <link rel="alternate" hreflang="en" href="https://shop.gyutron.com/shop/checkout.html">
    <link rel="alternate" hreflang="de" href="https://shop.gyutron.com/de/shop/checkout.html">
    <link rel="alternate" hreflang="ja" href="https://shop.gyutron.com/ja/shop/checkout.html">
    <link rel="alternate" hreflang="x-default" href="https://shop.gyutron.com/shop/checkout.html">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/de/shop/shop.css">
</head>
<body class="checkout-page">
    <a class="skip-link" href="#main-content" data-i18n="a11y.skipMain">Zum Hauptinhalt springen</a>
    <header class="checkout-header">
        <div class="checkout-header__inner">
            <a class="checkout-brand" href="/de/shop/index.html">
                <img src="/gyutron-logo-purple.png" alt="GYUTRON">
            </a>
            <nav class="checkout-header__nav" data-i18n-attr="aria-label=checkout.nav.label" aria-label="Navigation im Checkout">
                <a href="/de/shop/index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span data-i18n="checkout.nav.return">Zurück zum Store</span></a>
                <a href="/de/shop/account.html"><i class="fa-regular fa-user" aria-hidden="true"></i><span data-i18n="account.label">Konto</span></a>
                <a class="cart-link" href="/de/shop/cart.html"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i><span data-i18n="cart.label">Warenkorb</span><span class="cart-count" data-cart-count>0</span></a>
                <a href="/de/shop/contact-us.html"><i class="fa-regular fa-life-ring" aria-hidden="true"></i><span data-i18n="checkout.nav.support">Support</span></a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="checkout-page__main">
        <div class="checkout-mount" data-checkout-root></div>
    </main>

    <script>window.GYUTRON_SHOP_LOCALE="de";</script>
    <script src="/de/shop/shop-i18n.js"></script>
    <script src="/de/shop/shop.js"></script>
</body>
</html>
