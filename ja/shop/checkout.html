<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご購入手続き | GYUTRON 公式ストア</title>
    <meta name="description" content="産業製品注文のためのGYUTRON購入手続き依頼。">
    <meta property="og:title" content="ご購入手続き | GYUTRON 公式ストア">
    <meta property="og:description" content="産業製品注文のためのGYUTRON購入手続き依頼。">
    <meta property="og:locale" content="ja_JP">
    <link rel="canonical" href="https://shop.gyutron.com/ja/shop/checkout.html">
    <link rel="alternate" hreflang="en" href="https://shop.gyutron.com/shop/checkout.html">
    <link rel="alternate" hreflang="de" href="https://shop.gyutron.com/de/shop/checkout.html">
    <link rel="alternate" hreflang="ja" href="https://shop.gyutron.com/ja/shop/checkout.html">
    <link rel="alternate" hreflang="x-default" href="https://shop.gyutron.com/shop/checkout.html">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style id="gyutron-ja-typography">
      body, button, input, select, textarea {
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body { line-height: 1.7; }
      h1, h2, h3, h4 { font-weight: 700; line-height: 1.45; }
      p, li, label, td { font-weight: 400; }
      .nav a, .nav-links a, .nav-trigger, .nav-item > a,
      .store-language-menu a, .top-strip, .brand span {
        font-weight: 700;
        color: var(--ink, #17121f);
      }
      /* JA nav: bigger than the Latin-tuned 12px, no uppercase, tight tracking. */
      .nav, .nav-links, .nav a, .nav-links a, .nav-trigger {
        font-size: 15px;
        text-transform: none;
        letter-spacing: 0.01em;
      }
      .store-language-menu a { font-size: 14px; text-transform: none; }
      .store-language-menu a span { font-size: 12px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/ja/shop/shop.css">
</head>
<body class="checkout-page">
    <a class="skip-link" href="#main-content" data-i18n="a11y.skipMain">メインコンテンツへ移動</a>
    <header class="checkout-header">
        <div class="checkout-header__inner">
            <a class="checkout-brand" href="/ja/shop/index.html">
                <img src="/gyutron-logo-purple.png" alt="GYUTRON">
            </a>
            <nav class="checkout-header__nav" data-i18n-attr="aria-label=checkout.nav.label" aria-label="購入手続きナビゲーション">
                <a href="/ja/shop/index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i><span data-i18n="checkout.nav.return">ストアへ戻る</span></a>
                <a href="/ja/shop/account.html"><i class="fa-regular fa-user" aria-hidden="true"></i><span data-i18n="account.label">アカウント</span></a>
                <a class="cart-link" href="/ja/shop/cart.html"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i><span data-i18n="cart.label">カート</span><span class="cart-count" data-cart-count>0</span></a>
                <a href="/ja/shop/contact-us.html"><i class="fa-regular fa-life-ring" aria-hidden="true"></i><span data-i18n="checkout.nav.support">サポート</span></a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="checkout-page__main">
        <div class="checkout-mount" data-checkout-root></div>
    </main>

    <script>window.GYUTRON_SHOP_LOCALE="ja";</script>
    <script src="/ja/shop/shop-i18n.js"></script>
    <script src="/ja/shop/shop.js"></script>
</body>
</html>
