<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GYUTRON checkout divider comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f6; color: #15131a; font-family: Inter, Arial, sans-serif; }
    main { width: 1600px; margin: 0 auto; padding: 48px; }
    h1 { margin: 0 0 10px; font-size: 38px; letter-spacing: -.03em; }
    p { margin: 0 0 28px; color: #67616e; font-size: 16px; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
    figure { margin: 0; background: #fff; box-shadow: 0 5px 18px rgba(22, 17, 29, .055); }
    figcaption { padding: 16px 18px; color: #4b2e83; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    img { display: block; width: 100%; height: auto; }
    .mobile { margin-top: 28px; grid-template-columns: 390px 390px; justify-content: center; }
  </style>
</head>
<body>
  <main>
    <h1>Checkout step separation</h1>
    <p>Same layout and state. Only the divider treatment changes.</p>
    <section class="comparison">
      <figure>
        <figcaption>Before · continuous divider lines</figcaption>
        <img src="design-qa-implementation-checkout.png" alt="Checkout before shadow revision">
      </figure>
      <figure>
        <figcaption>After · whitespace + restrained shadow</figcaption>
        <img src="design-qa-shadow-checkout-desktop.png" alt="Checkout after shadow revision">
      </figure>
    </section>
    <section class="comparison mobile">
      <figure>
        <figcaption>Mobile before</figcaption>
        <img src="design-qa-implementation-mobile.png" alt="Mobile checkout before shadow revision">
      </figure>
      <figure>
        <figcaption>Mobile after</figcaption>
        <img src="design-qa-shadow-checkout-mobile.png" alt="Mobile checkout after shadow revision">
      </figure>
    </section>
  </main>
</body>
</html>
